<!DOCTYPE html>
<!--
=============================================================================
  SimpleOne Copilot — автономный модальный виджет (MVP)
=============================================================================

  АРХИТЕКТУРНОЕ СООТВЕТСТВИЕ В SIMPLEONE
  ───────────────────────────────────────
  Этот файл предназначен для встраивания одним из двух способов:

  1. Widget (Виджет):
     - Создайте новый виджет в SimpleOne Studio (sw_widget).
     - Вставьте содержимое <body> в поле «HTML Template» виджета.
     - Перенесите <style> в поле «CSS» виджета.
     - Перенесите <script> в поле «Client Script» виджета.
     - Параметры (record_id, table_name, number) передавайте через
       объект options виджета: widget.options.record_id и т.д.

  2. UI Action (Кнопка, открывающая модалку с iframe):
     - UI Action вызывает g_modal.showURL(url) или openModalIFrame(url),
       добавляя к URL параметры: table_name, record_id, number, simpleone_origin.
     - Этот файл (или его сборка) размещается на сервере/CDN и загружается
       в <iframe> внутри модального окна SimpleOne.
     - Ответные события из iframe принимаются через window.addEventListener('message').
       UI Action обрабатывает:
         copilot.insert_solution  → s_form.setValue('close_notes', e.data.payload.text)
         copilot.close_modal      → g_modal.close()

  ДАННЫЕ
  ──────
  Все KB-статьи, похожие заявки и ответы чат-бота — жёстко заданные
  mock-данные. Реальных вызовов к бэкенду или LLM нет.
=============================================================================
-->
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Копайлот</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      color: #1a2236;
      background: #fff;
      overflow: hidden;
    }
    button, textarea { font: inherit; }
    ul { list-style: none; }
    a  { color: inherit; text-decoration: none; }

    /* ── Modal shell ──────────────────────────────────────── */
    #copilot-modal {
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-width: 600px;
      background: #fff;
    }

    /* ── Header ───────────────────────────────────────────── */
    .cp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid #e4e9f2;
      flex-shrink: 0;
    }

    .cp-header-brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .cp-logo-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .cp-title {
      font-size: 17px;
      font-weight: 700;
      color: #1a2236;
    }

    .cp-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Buttons ──────────────────────────────────────────── */
    .cp-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: none;
      border-radius: 7px;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
      transition: background .13s, border-color .13s, opacity .13s;
      white-space: nowrap;
    }
    .cp-btn:disabled { opacity: .55; cursor: default; }

    .cp-btn-outline {
      background: #eef2fd;
      color: #2458e6;
      border: 1px solid #c7d5f9;
    }
    .cp-btn-outline:hover:not(:disabled) { background: #dde6fb; }

    .cp-btn-primary {
      background: #2458e6;
      color: #fff;
      padding: 8px 18px;
    }
    .cp-btn-primary:hover:not(:disabled) { background: #1d4ac5; }

    .cp-btn-action {
      background: #f0f4ff;
      color: #2458e6;
      border: 1px solid #d0dcfa;
      font-size: 13px;
      margin-top: 10px;
    }
    .cp-btn-action:hover { background: #dde6fb; }

    .cp-btn-vote {
      background: #f4f6fa;
      color: #5a6479;
      border: 1px solid #e4e9f2;
    }
    .cp-btn-vote:hover { background: #eef2fd; color: #2458e6; border-color: #b3c6f7; }
    .cp-btn-vote.voted { background: #eef2fd; color: #2458e6; border-color: #2458e6; }

    .cp-btn-ghost {
      background: #f4f6fa;
      color: #5a6479;
    }
    .cp-btn-ghost:hover { background: #e8ecf4; }

    .cp-btn-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      background: none;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      color: #8494ad;
      transition: background .13s, color .13s;
    }
    .cp-btn-icon:hover { background: #f0f2f7; color: #1a2236; }

    /* ── Tab navigation ───────────────────────────────────── */
    .cp-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .cp-tabs {
      display: flex;
      padding: 0 20px;
      border-bottom: 1px solid #e4e9f2;
      flex-shrink: 0;
    }

    .cp-tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 11px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #8494ad;
      cursor: pointer;
      margin-bottom: -1px;
      border-radius: 0;
      transition: color .13s, border-color .13s;
    }
    .cp-tab:hover { color: #2458e6; }
    .cp-tab[aria-selected="true"] { color: #2458e6; border-bottom-color: #2458e6; }

    .cp-panel {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      background: #f6f8fc;
    }
    .cp-panel.active { display: flex; flex-direction: column; }

    /* ── Cards ────────────────────────────────────────────── */
    .cp-card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cp-card {
      background: #fff;
      border: 1px solid #e4e9f2;
      border-radius: 10px;
      padding: 15px 16px;
      box-shadow: 0 1px 3px rgba(20,34,80,.05);
    }

    .cp-card-link {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: #2458e6;
      margin-bottom: 7px;
      line-height: 1.35;
    }
    .cp-card-link:hover { text-decoration: underline; }

    .cp-card-text {
      font-size: 13px;
      line-height: 1.55;
      color: #4e5d78;
    }

    /* ── Ticket badge ─────────────────────────────────────── */
    .cp-ticket-meta {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .cp-badge {
      font-size: 11.5px;
      font-weight: 700;
      color: #2458e6;
      background: #eef2fd;
      border-radius: 5px;
      padding: 2px 8px;
      white-space: nowrap;
    }

    .cp-ticket-desc {
      font-size: 13.5px;
      font-weight: 600;
      color: #1a2236;
    }

    /* ── Skeleton loader ──────────────────────────────────── */
    .sk-line, .sk-btn {
      border-radius: 5px;
      background: linear-gradient(90deg, #eef1f7 25%, #f5f7fb 50%, #eef1f7 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
    }
    .sk-line { height: 12px; margin-bottom: 8px; }
    .sk-btn  { height: 28px; width: 140px; margin-top: 10px; }
    .sk-w60  { width: 60%; }
    .sk-w80  { width: 80%; }
    .sk-w100 { width: 100%; }

    @keyframes shimmer {
      0%   { background-position:  200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Chat ─────────────────────────────────────────────── */
    #panel-chat {
      gap: 12px;
    }

    .cp-chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 4px;
    }

    .cp-msg { display: flex; }
    .cp-msg-bot  { justify-content: flex-start; }
    .cp-msg-user { justify-content: flex-end; }

    .cp-msg-bubble {
      max-width: 78%;
      padding: 9px 13px;
      font-size: 13px;
      line-height: 1.5;
      border-radius: 12px;
    }

    .cp-msg-bot .cp-msg-bubble {
      background: #fff;
      border: 1px solid #e4e9f2;
      color: #1a2236;
      border-radius: 2px 12px 12px 12px;
      box-shadow: 0 1px 3px rgba(20,34,80,.05);
    }

    .cp-msg-user .cp-msg-bubble {
      background: #2458e6;
      color: #fff;
      border-radius: 12px 2px 12px 12px;
    }

    /* Typing dots */
    .cp-typing {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 11px 14px;
      background: #fff;
      border: 1px solid #e4e9f2;
      border-radius: 2px 12px 12px 12px;
    }
    .cp-typing span {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8494ad;
      animation: blink 1.2s ease-in-out infinite;
    }
    .cp-typing span:nth-child(2) { animation-delay: .2s; }
    .cp-typing span:nth-child(3) { animation-delay: .4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: .3; transform: scale(.85); }
      40%            { opacity: 1;  transform: scale(1.1); }
    }

    .cp-chat-input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    .cp-chat-input {
      flex: 1;
      border: 1px solid #d7deea;
      border-radius: 8px;
      padding: 8px 12px;
      resize: none;
      font-size: 13px;
      line-height: 1.45;
      color: #1a2236;
      outline: none;
      transition: border-color .13s;
    }
    .cp-chat-input:focus { border-color: #2458e6; }

    /* ── Footer ───────────────────────────────────────────── */
    .cp-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      border-top: 1px solid #e4e9f2;
      flex-shrink: 0;
    }

    .cp-feedback {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .cp-feedback-label {
      font-size: 12.5px;
      color: #8494ad;
    }
  </style>
</head>
<body>

<div id="copilot-modal">

  <!-- HEADER -->
  <header class="cp-header">
    <div class="cp-header-brand">
      <svg class="cp-logo-icon" viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="10" r="8" fill="#2458e6" opacity=".12"/>
        <path d="M10 4l1.5 4.5H16l-3.75 2.7 1.44 4.3L10 13.1l-3.69 2.4 1.44-4.3L4 8.5h4.5L10 4z" fill="#2458e6"/>
      </svg>
      <h1 class="cp-title">Копайлот</h1>
    </div>
    <div class="cp-header-actions">
      <button class="cp-btn cp-btn-outline" id="btn-summarize">Суммировать заявку</button>
      <button class="cp-btn-icon" id="btn-close" aria-label="Закрыть">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8">
          <line x1="3" y1="3" x2="13" y2="13"/>
          <line x1="13" y1="3" x2="3" y2="13"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- BODY: tabs + panels -->
  <div class="cp-body">
    <nav class="cp-tabs" role="tablist">
      <button class="cp-tab" role="tab" aria-selected="true"  data-tab="hints"  >Подсказки ИИ</button>
      <button class="cp-tab" role="tab" aria-selected="false" data-tab="similar">Похожие заявки</button>
      <button class="cp-tab" role="tab" aria-selected="false" data-tab="chat"   >Чат</button>
    </nav>

    <!-- Panel: Подсказки ИИ -->
    <div class="cp-panel active" id="panel-hints" role="tabpanel">
      <!-- Skeleton loader — заменяется контентом через setTimeout -->
      <ul class="cp-card-list" id="hints-skeleton">
        <li class="cp-card">
          <div class="sk-line sk-w60"></div>
          <div class="sk-line sk-w100"></div>
          <div class="sk-line sk-w80"></div>
          <div class="sk-btn"></div>
        </li>
        <li class="cp-card">
          <div class="sk-line sk-w60"></div>
          <div class="sk-line sk-w100"></div>
          <div class="sk-line sk-w80"></div>
          <div class="sk-btn"></div>
        </li>
        <li class="cp-card">
          <div class="sk-line sk-w60"></div>
          <div class="sk-line sk-w100"></div>
          <div class="sk-line sk-w80"></div>
          <div class="sk-btn"></div>
        </li>
      </ul>
      <ul class="cp-card-list" id="hints-content" style="display:none"></ul>
    </div>

    <!-- Panel: Похожие заявки -->
    <div class="cp-panel" id="panel-similar" role="tabpanel">
      <ul class="cp-card-list" id="similar-content"></ul>
    </div>

    <!-- Panel: Чат -->
    <div class="cp-panel" id="panel-chat" role="tabpanel">
      <div class="cp-chat-messages" id="chat-messages"></div>
      <div class="cp-chat-input-row">
        <textarea
          class="cp-chat-input"
          id="chat-input"
          rows="2"
          placeholder="Введите сообщение… (Enter — отправить)"
        ></textarea>
        <button class="cp-btn cp-btn-primary" id="btn-send">Отправить</button>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="cp-footer">
    <div class="cp-feedback">
      <span class="cp-feedback-label">Полезно?</span>
      <button class="cp-btn cp-btn-vote" data-vote="up">👍 Полезно</button>
      <button class="cp-btn cp-btn-vote" data-vote="down">👎 Не полезно</button>
    </div>
    <button class="cp-btn cp-btn-ghost" id="btn-close-footer">Закрыть</button>
  </footer>

</div><!-- /#copilot-modal -->

<script>
(function () {
  'use strict';

  /* ── postMessage bridge ─────────────────────────────────── */
  var ctx = (function () {
    var q = new URLSearchParams(location.search);
    function origin(v) { try { return new URL(v).origin; } catch (e) { return ''; } }
    return {
      tableName:       q.get('table_name')       || '',
      recordId:        q.get('record_id')         || '',
      number:          q.get('number')            || '',
      simpleoneOrigin: origin(q.get('simpleone_origin') || ''),
    };
  }());

  var isIframe = window.parent !== window;
  var targetOrigin = ctx.simpleoneOrigin || '*';

  function post(type, extra) {
    if (!isIframe) return;
    window.parent.postMessage(
      { type: type, payload: Object.assign({
          table_name: ctx.tableName,
          record_id:  ctx.recordId,
          number:     ctx.number,
        }, extra) },
      targetOrigin
    );
  }

  function closeModal() { post('copilot.close_modal'); }
  function insertSolution(text) { post('copilot.insert_solution', { text: text }); }

  /* ── Mock data ──────────────────────────────────────────── */
  var KB_ARTICLES = [
    {
      title:    'Сброс пароля в корпоративной сети',
      excerpt:  'Для сброса пароля сотрудника необходимо перейти в AD Users and Computers, найти учётную запись и выполнить сброс через контекстное меню. Убедитесь, что пользователь авторизован для смены пароля при следующем входе.',
      solution: 'Выполнен сброс пароля через AD Users and Computers. Пользователю отправлена инструкция по смене пароля при следующем входе. Учётная запись разблокирована.',
    },
    {
      title:    'Настройка VPN-подключения для удалённых сотрудников',
      excerpt:  'Инструкция по настройке корпоративного VPN-клиента на Windows 10/11. Включает установку сертификатов и конфигурацию профиля подключения для безопасного доступа к внутренним ресурсам компании.',
      solution: 'Установлен VPN-клиент версии 4.2.1, настроен профиль подключения с использованием корпоративного сертификата. Подключение проверено и работает стабильно.',
    },
    {
      title:    'Восстановление доступа к корпоративной почте',
      excerpt:  'При блокировке учётной записи Exchange необходимо выполнить разблокировку через EAC. Проверьте политику паролей и статус лицензии пользователя в Microsoft 365 Admin Center.',
      solution: 'Учётная запись Exchange разблокирована через EAC. Проверена и скорректирована политика паролей. Лицензия Office 365 активна, доступ к почте восстановлен.',
    },
  ];

  var SIMILAR_TICKETS = [
    {
      number:      'INC0041872',
      description: 'Не работает авторизация в корпоративном портале',
      resolution:  'Выполнен сброс сессии пользователя, очищен кэш браузера. Проблема связана с устаревшим токеном авторизации. После повторного входа доступ восстановлен.',
    },
    {
      number:      'INC0038541',
      description: 'Запрос на сброс пароля для нового сотрудника',
      resolution:  'Создана учётная запись в AD, выдан временный пароль. Пользователю отправлено письмо с инструкцией по первому входу и обязательной смене пароля через самосервисный портал.',
    },
    {
      number:      'INC0035209',
      description: 'Не удаётся подключиться к VPN из домашней сети',
      resolution:  'Переустановлен VPN-клиент, обновлены сертификаты пользователя. Проблема заключалась в истёкшем сертификате. VPN-подключение восстановлено и протестировано.',
    },
  ];

  var BOT_REPLIES = [
    'На основе описания заявки рекомендую проверить настройки учётной записи в Active Directory — возможна блокировка или истечение срока пароля.',
    'Похожие инциденты чаще всего решаются перезапуском службы или очисткой кэша браузера. Попробуйте эти шаги и сообщите о результате.',
    'Для данной категории заявок средний SLA составляет 4 часа. Рекомендую эскалировать в L2, если проблема не решена за 2 часа.',
    'Нашёл 3 похожие заявки в базе. Наиболее вероятное решение — сброс пароля и проверка прав доступа пользователя.',
  ];

  /* ── Tab switching ──────────────────────────────────────── */
  var tabBtns  = document.querySelectorAll('.cp-tab');
  var panels   = document.querySelectorAll('.cp-panel');

  tabBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var target = btn.dataset.tab;
      tabBtns.forEach(function (b) { b.setAttribute('aria-selected', 'false'); });
      panels.forEach(function (p)  { p.classList.remove('active'); });
      btn.setAttribute('aria-selected', 'true');
      document.getElementById('panel-' + target).classList.add('active');
    });
  });

  /* ── Hints tab: skeleton → content ─────────────────────── */
  function buildHints() {
    var list = document.getElementById('hints-content');
    KB_ARTICLES.forEach(function (a) {
      var li = document.createElement('li');
      li.className = 'cp-card';
      li.innerHTML =
        '<a href="#" class="cp-card-link">' + escHtml(a.title) + '</a>' +
        '<p class="cp-card-text">' + escHtml(a.excerpt) + '</p>';
      var btn = document.createElement('button');
      btn.className = 'cp-btn cp-btn-action';
      btn.textContent = 'Вставить решение';
      btn.addEventListener('click', function () { insertSolution(a.solution); });
      li.appendChild(btn);
      list.appendChild(li);
    });
    document.querySelectorAll('.cp-card-link').forEach(function (a) {
      a.addEventListener('click', function (e) { e.preventDefault(); });
    });
  }

  setTimeout(function () {
    document.getElementById('hints-skeleton').style.display = 'none';
    document.getElementById('hints-content').style.display  = '';
  }, 1300);

  buildHints();

  /* ── Similar tickets tab ────────────────────────────────── */
  (function buildSimilar() {
    var list = document.getElementById('similar-content');
    SIMILAR_TICKETS.forEach(function (t) {
      var li = document.createElement('li');
      li.className = 'cp-card';
      li.innerHTML =
        '<div class="cp-ticket-meta">' +
          '<span class="cp-badge">' + escHtml(t.number) + '</span>' +
          '<span class="cp-ticket-desc">' + escHtml(t.description) + '</span>' +
        '</div>' +
        '<p class="cp-card-text">' + escHtml(t.resolution) + '</p>';
      var btn = document.createElement('button');
      btn.className = 'cp-btn cp-btn-action';
      btn.textContent = 'Клонировать решение';
      btn.addEventListener('click', function () { insertSolution(t.resolution); });
      li.appendChild(btn);
      list.appendChild(li);
    });
  }());

  /* ── Chat tab ───────────────────────────────────────────── */
  var chatMessages = document.getElementById('chat-messages');
  var chatInput    = document.getElementById('chat-input');
  var btnSend      = document.getElementById('btn-send');
  var msgCount     = 0;
  var chatBusy     = false;

  addBotMessage('Привет! Я Копайлот. Задайте вопрос по текущей заявке.');

  function addBotMessage(text) {
    var div = document.createElement('div');
    div.className = 'cp-msg cp-msg-bot';
    div.innerHTML = '<span class="cp-msg-bubble">' + escHtml(text) + '</span>';
    chatMessages.appendChild(div);
    scrollChat();
    return div;
  }

  function addUserMessage(text) {
    var div = document.createElement('div');
    div.className = 'cp-msg cp-msg-user';
    div.innerHTML = '<span class="cp-msg-bubble">' + escHtml(text) + '</span>';
    chatMessages.appendChild(div);
    scrollChat();
  }

  function showTyping() {
    var div = document.createElement('div');
    div.className = 'cp-msg cp-msg-bot';
    div.innerHTML = '<span class="cp-typing"><span></span><span></span><span></span></span>';
    chatMessages.appendChild(div);
    scrollChat();
    return div;
  }

  function scrollChat() {
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function sendChat() {
    var text = chatInput.value.trim();
    if (!text || chatBusy) return;
    chatBusy = true;
    chatInput.value = '';
    addUserMessage(text);
    msgCount++;
    var typing = showTyping();
    btnSend.disabled = true;
    setTimeout(function () {
      typing.remove();
      addBotMessage(BOT_REPLIES[msgCount % BOT_REPLIES.length]);
      chatBusy = false;
      btnSend.disabled = false;
    }, 700);
  }

  btnSend.addEventListener('click', sendChat);
  chatInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });

  /* ── Header: summarize ──────────────────────────────────── */
  var btnSummarize = document.getElementById('btn-summarize');
  btnSummarize.addEventListener('click', function () {
    btnSummarize.disabled = true;
    btnSummarize.textContent = 'Анализирую…';
    setTimeout(function () {
      btnSummarize.disabled = false;
      btnSummarize.textContent = 'Суммировать заявку';
    }, 1800);
  });

  /* ── Close buttons ──────────────────────────────────────── */
  document.getElementById('btn-close').addEventListener('click', closeModal);
  document.getElementById('btn-close-footer').addEventListener('click', closeModal);

  /* ── Feedback votes ─────────────────────────────────────── */
  document.querySelectorAll('.cp-btn-vote').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.cp-btn-vote').forEach(function (b) {
        b.classList.remove('voted');
      });
      btn.classList.add('voted');
    });
  });

  /* ── Utility ────────────────────────────────────────────── */
  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

}());
</script>
</body>
</html>
