<!DOCTYPE html>
<!--
// SIMPLEONE COPILOT FRONTEND
// postMessage contract version: 1.0
// Compatible with: copilot_ui_action.js
//
// АРХИТЕКТУРНОЕ СООТВЕТСТВИЕ В SIMPLEONE
// ───────────────────────────────────────
// Этот файл встраивается в iframe модального окна SimpleOne UI Action.
// UI Action передаёт параметры в URL: table_name, record_id, number, subject, simpleone_origin.
// Затем шлёт handshake: { type:'copilot.handshake', payload:{ record_id, table_name, csrf_token } }
//
// Исходящие события (iframe → SimpleOne):
//   copilot.insert_solution  → payload: { text }
//   copilot.close_modal      → без payload
//   copilot.link_ticket      → payload: { related_record_id, related_number }
//   copilot.feedback         → payload: { value:'helpful'|'not_helpful'|'applied', source_type, source_id }
//
// Все postMessage отправляются строго на simpleone_origin из URL-параметра.
-->
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Копайлот</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      color: #1e293b;
      background: #fff;
      overflow: hidden;
    }
    button, textarea { font: inherit; }
    ul { list-style: none; }
    a  { text-decoration: none; }

    /* ── Modal ──────────────────────────────── */
    #copilot {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #fff;
    }

    /* ── Header ─────────────────────────────── */
    .cp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 24px;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .cp-header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .cp-logo { flex-shrink: 0; width: 28px; height: 28px; }
    .cp-logo svg { width: 28px; height: 28px; }
    .cp-title { font-size: 16px; font-weight: 700; color: #1e293b; }
    .cp-subtitle { display: flex; align-items: center; gap: 7px; margin-top: 3px; flex-wrap: wrap; }
    .cp-ticket-chip {
      font-size: 11px; font-weight: 700; color: #2563eb;
      background: #eff6ff; border-radius: 4px; padding: 1px 7px; white-space: nowrap;
    }
    .cp-subject-text {
      font-size: 12px; color: #64748b;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 500px;
    }
    .cp-header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    /* ── Buttons ────────────────────────────── */
    .cp-btn {
      display: inline-flex; align-items: center; gap: 6px;
      border: none; border-radius: 7px; padding: 7px 14px;
      cursor: pointer; font-size: 13px; font-weight: 600; line-height: 1;
      transition: background .12s, opacity .12s; white-space: nowrap;
    }
    .cp-btn:disabled { opacity: .5; cursor: default; }
    .cp-btn-outline { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
    .cp-btn-outline:hover:not(:disabled) { background: #dbeafe; }
    .cp-btn-primary { background: #2563eb; color: #fff; padding: 8px 18px; }
    .cp-btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .cp-btn-action  { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; font-size: 12.5px; }
    .cp-btn-action:hover { background: #dbeafe; }
    .cp-btn-ghost   { background: #f8fafc; color: #475569; border: 1px solid #e2e8f0; font-size: 12.5px; }
    .cp-btn-ghost:hover { background: #f1f5f9; }
    .cp-btn-applied { background: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0; }
    .cp-btn-icon {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border: none; border-radius: 7px;
      background: none; cursor: pointer; color: #94a3b8;
      transition: background .12s, color .12s;
    }
    .cp-btn-icon svg { width: 14px; height: 14px; }
    .cp-btn-icon:hover { background: #f1f5f9; color: #1e293b; }
    .cp-spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid #bfdbfe; border-top-color: #2563eb;
      border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Tabs ───────────────────────────────── */
    .cp-body { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
    .cp-tabs {
      display: flex; padding: 0 24px;
      border-bottom: 1px solid #e2e8f0; flex-shrink: 0;
    }
    .cp-tab {
      background: none; border: none; border-bottom: 2px solid transparent;
      padding: 11px 16px; font-size: 13px; font-weight: 600;
      color: #94a3b8; cursor: pointer; margin-bottom: -1px;
      transition: color .12s, border-color .12s;
    }
    .cp-tab:hover { color: #2563eb; }
    .cp-tab.active { color: #2563eb; border-bottom-color: #2563eb; }

    .cp-panel {
      flex: 1; overflow-y: auto;
      padding: 16px 24px; background: #f8f9fa; display: none;
    }
    .cp-panel.active { display: block; }
    #panel-chat.active { display: flex; flex-direction: column; padding: 0; }

    /* ── Cards ──────────────────────────────── */
    .cp-card-list { display: flex; flex-direction: column; gap: 10px; }
    .cp-card {
      background: #fff; border: 1px solid #e2e8f0;
      border-radius: 10px; padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .cp-card-link {
      display: block; font-size: 13.5px; font-weight: 600;
      color: #2563eb; margin-bottom: 7px; line-height: 1.35;
    }
    .cp-card-link:hover { text-decoration: underline; }
    .cp-card-text { font-size: 13px; line-height: 1.6; color: #475569; }
    .cp-expand-btn {
      background: none; border: none; color: #2563eb;
      font-size: 12.5px; font-weight: 600; cursor: pointer;
      padding: 0; margin-left: 4px;
    }
    .cp-expand-btn:hover { text-decoration: underline; }
    .cp-card-actions {
      display: flex; align-items: center;
      flex-wrap: wrap; gap: 8px; margin-top: 12px;
    }
    .cp-ticket-meta { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .cp-badge {
      font-size: 11px; font-weight: 700; color: #2563eb;
      background: #eff6ff; border-radius: 4px; padding: 2px 8px; white-space: nowrap;
    }
    .cp-ticket-desc { font-size: 13.5px; font-weight: 600; color: #1e293b; }

    /* Feedback */
    .cp-feedback-row { display: flex; align-items: center; gap: 5px; margin-left: auto; }
    .cp-feedback-label { font-size: 12px; color: #94a3b8; }
    .cp-vote-btn {
      background: none; border: 1px solid #e2e8f0; border-radius: 6px;
      padding: 3px 8px; cursor: pointer; font-size: 13px; line-height: 1;
      transition: background .12s, border-color .12s;
    }
    .cp-vote-btn:hover { background: #f1f5f9; border-color: #cbd5e1; }
    .cp-vote-btn.active { background: #eff6ff; border-color: #2563eb; }

    /* ── Skeleton ───────────────────────────── */
    .sk {
      height: 12px; border-radius: 5px;
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      margin-bottom: 9px;
    }
    .sk-w40  { width: 40%; }
    .sk-w55  { width: 55%; }
    .sk-w80  { width: 80%; }
    .sk-w100 { width: 100%; }
    .sk-btn  { height: 28px; width: 150px; margin-top: 12px; margin-bottom: 0; }
    @keyframes shimmer {
      0%   { background-position:  200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Chat ───────────────────────────────── */
    .cp-chat { display: flex; flex-direction: column; height: 100%; }
    .cp-chat-messages {
      flex: 1; overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px;
      padding: 16px 24px;
    }
    .cp-msg { display: flex; align-items: flex-start; gap: 9px; }
    .cp-msg-bot  { justify-content: flex-start; }
    .cp-msg-user { justify-content: flex-end; flex-direction: row-reverse; }
    .cp-avatar {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
      background: #2563eb; color: #fff; font-size: 10px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; margin-top: 2px;
    }
    .cp-msg-body { display: flex; flex-direction: column; gap: 5px; max-width: 76%; }
    .cp-msg-bubble {
      display: inline-block; padding: 9px 13px;
      border-radius: 10px; font-size: 13px; line-height: 1.55;
    }
    .cp-msg-bot .cp-msg-bubble {
      background: #fff; border: 1px solid #e2e8f0; color: #1e293b;
      border-radius: 2px 10px 10px 10px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .cp-msg-user .cp-msg-bubble {
      background: #2563eb; color: #fff;
      border-radius: 10px 2px 10px 10px;
    }
    .cp-typing {
      display: inline-flex; align-items: center; gap: 4px; padding: 11px 14px;
    }
    .cp-typing span {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: #94a3b8; animation: blink 1.3s ease-in-out infinite;
    }
    .cp-typing span:nth-child(2) { animation-delay: .2s; }
    .cp-typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: .25; transform: scale(.8); }
      40%            { opacity: 1;   transform: scale(1.1); }
    }
    .cp-citations { display: flex; flex-wrap: wrap; gap: 5px; }
    .cp-citation-chip {
      font-size: 11.5px; font-weight: 600; color: #2563eb;
      background: #eff6ff; border: 1px solid #bfdbfe;
      border-radius: 20px; padding: 2px 10px; cursor: pointer;
      transition: background .12s;
    }
    .cp-citation-chip:hover { background: #dbeafe; }
    .cp-chat-input-row {
      display: flex; align-items: flex-end; gap: 8px;
      padding: 12px 24px; border-top: 1px solid #e2e8f0;
      background: #fff; flex-shrink: 0;
    }
    .cp-chat-input {
      flex: 1; border: 1px solid #cbd5e1; border-radius: 8px;
      padding: 8px 12px; resize: none; font-size: 13px; line-height: 1.45;
      color: #1e293b; outline: none; transition: border-color .12s;
    }
    .cp-chat-input:focus { border-color: #2563eb; }

    /* ── Footer ─────────────────────────────── */
    .cp-footer {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 11px 24px;
      border-top: 1px solid #e2e8f0; background: #fff; flex-shrink: 0;
    }
    .cp-ai-status { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #64748b; }
    .cp-status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .cp-status-dot.online  { background: #22c55e; box-shadow: 0 0 0 2px #dcfce7; }
    .cp-status-dot.offline { background: #ef4444; box-shadow: 0 0 0 2px #fee2e2; }
  </style>
</head>
<body>
<div id="copilot">

  <!-- HEADER -->
  <header class="cp-header">
    <div class="cp-header-left">
      <div class="cp-logo">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" fill="#2563eb" opacity=".15"/>
          <path d="M12 5l2 5.5h5.5l-4.5 3.2 1.7 5.3L12 16l-4.7 3 1.7-5.3L4.5 10.5H10L12 5z" fill="#2563eb"/>
        </svg>
      </div>
      <div>
        <h1 class="cp-title">Копайлот</h1>
        <div class="cp-subtitle" id="header-subtitle"></div>
      </div>
    </div>
    <div class="cp-header-right">
      <button class="cp-btn cp-btn-outline" id="btn-summarize">Суммировать заявку</button>
      <button class="cp-btn-icon" id="btn-close" aria-label="Закрыть">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="3" x2="13" y2="13"/><line x1="13" y1="3" x2="3" y2="13"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- TABS -->
  <div class="cp-body">
    <nav class="cp-tabs" role="tablist">
      <button class="cp-tab active" role="tab" aria-selected="true"  data-panel="panel-hints">Подсказки ИИ</button>
      <button class="cp-tab"        role="tab" aria-selected="false" data-panel="panel-similar">Похожие заявки</button>
      <button class="cp-tab"        role="tab" aria-selected="false" data-panel="panel-chat">Чат</button>
    </nav>

    <!-- Panel: Подсказки ИИ -->
    <div class="cp-panel active" id="panel-hints" role="tabpanel">
      <ul class="cp-card-list" id="hints-skeleton">
        <li class="cp-card"><div class="sk sk-w55"></div><div class="sk sk-w100"></div><div class="sk sk-w80"></div><div class="sk sk-btn"></div></li>
        <li class="cp-card"><div class="sk sk-w55"></div><div class="sk sk-w100"></div><div class="sk sk-w80"></div><div class="sk sk-btn"></div></li>
        <li class="cp-card"><div class="sk sk-w55"></div><div class="sk sk-w100"></div><div class="sk sk-w80"></div><div class="sk sk-btn"></div></li>
      </ul>
      <ul class="cp-card-list" id="hints-content" style="display:none"></ul>
    </div>

    <!-- Panel: Похожие заявки -->
    <div class="cp-panel" id="panel-similar" role="tabpanel">
      <ul class="cp-card-list" id="similar-content"></ul>
    </div>

    <!-- Panel: Чат -->
    <div class="cp-panel" id="panel-chat" role="tabpanel">
      <div class="cp-chat">
        <div class="cp-chat-messages" id="chat-messages"></div>
        <div class="cp-chat-input-row">
          <textarea class="cp-chat-input" id="chat-input" rows="2" placeholder="Введите сообщение… (Enter — отправить)"></textarea>
          <button class="cp-btn cp-btn-primary" id="btn-send">Отправить</button>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="cp-footer">
    <button class="cp-btn cp-btn-outline" id="btn-applied">Применено ✓</button>
    <div class="cp-ai-status">
      <span class="cp-status-dot online" id="ai-status-dot"></span>
      <span id="ai-status-text">ИИ доступен</span>
    </div>
  </footer>

</div>

<script>
(function () {
  'use strict';

  /* ── URL context & postMessage bridge ──────────────────── */
  var q = new URLSearchParams(location.search);
  function origin(v) { try { return new URL(v).origin; } catch (e) { return ''; } }

  var SO_ORIGIN = origin(q.get('simpleone_origin') || '');
  var ctx = {
    tableName: q.get('table_name') || '',
    recordId:  q.get('record_id')  || '',
    number:    q.get('number')     || '',
    subject:   q.get('subject')    || 'Не удаётся войти в корпоративный портал',
    csrfToken: '',
  };

  // Incoming handshake
  window.addEventListener('message', function (e) {
    if (SO_ORIGIN && e.origin !== SO_ORIGIN) return;
    if (!e.data || e.data.type !== 'copilot.handshake') return;
    var p = e.data.payload || {};
    if (p.record_id)   ctx.recordId  = p.record_id;
    if (p.table_name)  ctx.tableName = p.table_name;
    if (p.csrf_token)  ctx.csrfToken = p.csrf_token;
  });

  function post(type, payload) {
    if (window.parent === window || !SO_ORIGIN) return;
    window.parent.postMessage({ type: type, payload: payload || {} }, SO_ORIGIN);
  }

  function closeModal()   { post('copilot.close_modal'); }
  function insertSolution(text, srcType, srcId) {
    post('copilot.insert_solution', { text: text });
    setApplied();
  }
  function sendFeedback(value, srcType, srcId) {
    post('copilot.feedback', { value: value, source_type: srcType, source_id: srcId });
  }
  function linkTicket(relRecordId, relNumber) {
    post('copilot.link_ticket', { related_record_id: relRecordId, related_number: relNumber });
  }

  /* ── Header subtitle ───────────────────────────────────── */
  (function () {
    var sub = document.getElementById('header-subtitle');
    if (!sub) return;
    var html = '';
    if (ctx.number)  html += '<span class="cp-ticket-chip">' + esc(ctx.number) + '</span>';
    if (ctx.subject) html += '<span class="cp-subject-text">' + esc(ctx.subject) + '</span>';
    sub.innerHTML = html;
  }());

  /* ── Mock data ─────────────────────────────────────────── */
  var KB = [
    { id:'kb-001', title:'Сброс пароля в корпоративной сети AD', url:'#kb-001',
      excerpt:'Для сброса пароля перейдите в AD Users and Computers, найдите учётную запись и выполните сброс через контекстное меню. Убедитесь, что у пользователя включена опция «Сменить пароль при следующем входе».',
      solution:'Выполнен сброс пароля через AD Users and Computers. Пользователю отправлена инструкция по смене пароля при следующем входе. Учётная запись разблокирована.' },
    { id:'kb-002', title:'Настройка VPN-подключения для удалённых сотрудников', url:'#kb-002',
      excerpt:'Инструкция по установке корпоративного VPN-клиента на Windows 10/11. Включает конфигурацию профиля и установку сертификата для безопасного доступа к внутренним ресурсам.',
      solution:'Установлен VPN-клиент версии 4.2.1, настроен профиль с корпоративным сертификатом. Подключение проверено и работает стабильно.' },
    { id:'kb-003', title:'Восстановление доступа к Exchange / Microsoft 365', url:'#kb-003',
      excerpt:'При блокировке учётной записи Exchange выполните разблокировку через EAC. Проверьте политику паролей и статус лицензии в Microsoft 365 Admin Center.',
      solution:'Учётная запись Exchange разблокирована через EAC. Политика паролей скорректирована. Лицензия Office 365 активна, доступ восстановлен.' },
  ];

  var TICKETS = [
    { id:'inc-001', number:'INC0041872', recordId:'a1b2c3d4e5f6',
      description:'Не работает авторизация в корпоративном портале',
      resolution:'Выполнен сброс сессии пользователя, очищен кэш браузера. Проблема связана с устаревшим токеном авторизации. После повторного входа доступ восстановлен в полном объёме.' },
    { id:'inc-002', number:'INC0038541', recordId:'b2c3d4e5f6a1',
      description:'Запрос на сброс пароля для нового сотрудника',
      resolution:'Создана учётная запись в AD, выдан временный пароль. Пользователю отправлено письмо с инструкцией по первому входу и обязательной смене пароля через самосервисный портал.' },
    { id:'inc-003', number:'INC0035209', recordId:'c3d4e5f6a1b2',
      description:'Не удаётся подключиться к VPN из домашней сети',
      resolution:'Переустановлен VPN-клиент, обновлены сертификаты пользователя. Причина — истёкший клиентский сертификат. VPN-подключение восстановлено и протестировано.' },
  ];

  var BOT = [
    { text:'На основе описания рекомендую проверить учётную запись в Active Directory — вероятна блокировка или истечение срока пароля.',
      cit:[{label:'KB: Сброс пароля AD',id:'kb-001'},{label:'INC0041872',id:'inc-001'}] },
    { text:'Похожие инциденты решались перезапуском службы или очисткой кэша браузера. Попробуйте эти шаги и сообщите о результате.',
      cit:[{label:'INC0038541',id:'inc-002'}] },
    { text:'Для данной категории заявок средний SLA — 4 часа. Рекомендую эскалировать в L2, если проблема не решена за 2 часа.',
      cit:[] },
    { text:'Нашёл 3 похожие заявки. Наиболее вероятное решение — сброс пароля и проверка прав доступа.',
      cit:[{label:'KB: VPN-подключение',id:'kb-002'},{label:'INC0035209',id:'inc-003'}] },
  ];

  /* ── Tabs ──────────────────────────────────────────────── */
  var tabBtns = document.querySelectorAll('.cp-tab');
  var panels  = document.querySelectorAll('.cp-panel');

  tabBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      tabBtns.forEach(function (b) { b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
      panels.forEach(function (p) { p.classList.remove('active'); });
      btn.classList.add('active');
      btn.setAttribute('aria-selected','true');
      document.getElementById(btn.dataset.panel).classList.add('active');
    });
  });

  /* ── Hints tab ─────────────────────────────────────────── */
  setTimeout(function () {
    document.getElementById('hints-skeleton').style.display = 'none';
    var list = document.getElementById('hints-content');
    list.style.display = '';
    KB.forEach(function (a) {
      var li = document.createElement('li');
      li.className = 'cp-card';
      li.innerHTML =
        '<a href="' + esc(a.url) + '" class="cp-card-link" target="_blank" rel="noreferrer">' + esc(a.title) + '</a>' +
        '<p class="cp-card-text">' + esc(a.excerpt) + '</p>';
      var actions = document.createElement('div');
      actions.className = 'cp-card-actions';
      var ins = makeBtn('cp-btn cp-btn-action', 'Вставить решение', function () { insertSolution(a.solution,'kb_article',a.id); });
      actions.appendChild(ins);
      actions.appendChild(makeFeedbackRow('kb_article', a.id));
      li.appendChild(actions);
      list.appendChild(li);
    });
  }, 1000);

  /* ── Similar tab ───────────────────────────────────────── */
  (function () {
    var list = document.getElementById('similar-content');
    var SHORT = 120;
    TICKETS.forEach(function (t) {
      var li = document.createElement('li');
      li.className = 'cp-card';
      var expanded = false;
      var isLong = t.resolution.length > SHORT;
      var shortText = isLong ? t.resolution.slice(0, SHORT) + '…' : t.resolution;

      var meta = '<div class="cp-ticket-meta"><span class="cp-badge">' + esc(t.number) + '</span><span class="cp-ticket-desc">' + esc(t.description) + '</span></div>';
      var p = document.createElement('p');
      p.className = 'cp-card-text';
      p.textContent = shortText;

      var expandBtn;
      if (isLong) {
        expandBtn = document.createElement('button');
        expandBtn.className = 'cp-expand-btn';
        expandBtn.textContent = ' Показать полностью';
        expandBtn.addEventListener('click', function () {
          expanded = !expanded;
          p.textContent = expanded ? t.resolution : shortText;
          if (expanded) p.appendChild(expandBtn);
          expandBtn.textContent = expanded ? ' Свернуть' : ' Показать полностью';
        });
        p.appendChild(expandBtn);
      }

      li.innerHTML = meta;
      li.appendChild(p);

      var actions = document.createElement('div');
      actions.className = 'cp-card-actions';
      actions.appendChild(makeBtn('cp-btn cp-btn-action', 'Клонировать решение', function () { insertSolution(t.resolution,'similar_ticket',t.id); }));
      actions.appendChild(makeBtn('cp-btn cp-btn-ghost', 'Связать заявку', function () { linkTicket(t.recordId, t.number); }));
      actions.appendChild(makeFeedbackRow('similar_ticket', t.id));
      li.appendChild(actions);
      list.appendChild(li);
    });
  }());

  /* ── Chat tab ──────────────────────────────────────────── */
  var chatEl   = document.getElementById('chat-messages');
  var inputEl  = document.getElementById('chat-input');
  var sendEl   = document.getElementById('btn-send');
  var botIdx   = 0;
  var chatBusy = false;

  addBotMsg('Привет! Я Копайлот. Задайте вопрос по текущей заявке — постараюсь помочь.', []);

  function addBotMsg(text, cit) {
    var row = document.createElement('div');
    row.className = 'cp-msg cp-msg-bot';
    var av = document.createElement('div');
    av.className = 'cp-avatar';
    av.textContent = 'AI';
    var body = document.createElement('div');
    body.className = 'cp-msg-body';
    var bub = document.createElement('span');
    bub.className = 'cp-msg-bubble';
    bub.textContent = text;
    body.appendChild(bub);
    if (cit && cit.length) {
      var citRow = document.createElement('div');
      citRow.className = 'cp-citations';
      cit.forEach(function (c) {
        var a = document.createElement('a');
        a.className = 'cp-citation-chip';
        a.href = '#' + c.id;
        a.textContent = c.label;
        citRow.appendChild(a);
      });
      body.appendChild(citRow);
    }
    row.appendChild(av); row.appendChild(body);
    chatEl.appendChild(row);
    chatEl.scrollTop = chatEl.scrollHeight;
    return row;
  }

  function addUserMsg(text) {
    var row = document.createElement('div');
    row.className = 'cp-msg cp-msg-user';
    var body = document.createElement('div');
    body.className = 'cp-msg-body';
    var bub = document.createElement('span');
    bub.className = 'cp-msg-bubble';
    bub.textContent = text;
    body.appendChild(bub);
    row.appendChild(body);
    chatEl.appendChild(row);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function addTyping() {
    var row = document.createElement('div');
    row.className = 'cp-msg cp-msg-bot';
    var av = document.createElement('div');
    av.className = 'cp-avatar';
    av.textContent = 'AI';
    var body = document.createElement('div');
    body.className = 'cp-msg-body';
    var bub = document.createElement('span');
    bub.className = 'cp-msg-bubble cp-typing';
    bub.innerHTML = '<span></span><span></span><span></span>';
    body.appendChild(bub);
    row.appendChild(av); row.appendChild(body);
    chatEl.appendChild(row);
    chatEl.scrollTop = chatEl.scrollHeight;
    return row;
  }

  function sendChat() {
    var text = inputEl.value.trim();
    if (!text || chatBusy) return;
    chatBusy = true;
    inputEl.value = '';
    addUserMsg(text);
    var typing = addTyping();
    sendEl.disabled = true;
    setTimeout(function () {
      typing.remove();
      var r = BOT[botIdx % BOT.length]; botIdx++;
      addBotMsg(r.text, r.cit);
      chatBusy = false;
      sendEl.disabled = false;
    }, 800);
  }

  sendEl.addEventListener('click', sendChat);
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });

  /* ── Header buttons ────────────────────────────────────── */
  var sumBtn = document.getElementById('btn-summarize');
  sumBtn.addEventListener('click', function () {
    sumBtn.disabled = true;
    sumBtn.innerHTML = '<span class="cp-spinner"></span> Анализирую…';
    setTimeout(function () {
      sumBtn.disabled = false;
      sumBtn.textContent = 'Суммировать заявку';
    }, 2000);
  });

  document.getElementById('btn-close').addEventListener('click', closeModal);

  /* ── Footer ────────────────────────────────────────────── */
  var appliedBtn = document.getElementById('btn-applied');
  appliedBtn.addEventListener('click', function () {
    post('copilot.feedback', { value:'applied', source_type:'manual', source_id:'' });
    setApplied();
  });

  function setApplied() {
    appliedBtn.classList.remove('cp-btn-outline');
    appliedBtn.classList.add('cp-btn-applied');
    appliedBtn.disabled = true;
  }

  /* ── Helpers ───────────────────────────────────────────── */
  function makeBtn(cls, label, fn) {
    var b = document.createElement('button');
    b.className = cls; b.textContent = label;
    b.addEventListener('click', fn);
    return b;
  }

  function makeFeedbackRow(srcType, srcId) {
    var row = document.createElement('div');
    row.className = 'cp-feedback-row';
    var lbl = document.createElement('span');
    lbl.className = 'cp-feedback-label';
    lbl.textContent = 'Полезно?';
    var up   = makeVoteBtn('👍', 'helpful',     srcType, srcId, row);
    var down = makeVoteBtn('👎', 'not_helpful', srcType, srcId, row);
    row.append(lbl, up, down);
    return row;
  }

  function makeVoteBtn(emoji, value, srcType, srcId, row) {
    var b = document.createElement('button');
    b.className = 'cp-vote-btn';
    b.textContent = emoji;
    b.addEventListener('click', function () {
      row.querySelectorAll('.cp-vote-btn').forEach(function (v) { v.classList.remove('active'); });
      b.classList.add('active');
      sendFeedback(value, srcType, srcId);
    });
    return b;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

}());
</script>
</body>
</html>
