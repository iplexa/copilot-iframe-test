services:
  copilot-frontend:
    build: .
    container_name: copilot-frontend
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - YANDEX_API_KEY=${YANDEX_API_KEY}
      - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID}
    networks:
      - caddy_network

networks:
  caddy_network:
    external: true
    name: remnawave-network
