services:
  copilot-frontend:
    build: .
    container_name: copilot-frontend
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    networks:
      - caddy_network

networks:
  caddy_network:
    external: true
    name: remnawave-network
